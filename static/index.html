<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基隆景點導覽 | Keelung Tourism Explorer</title>
    
    <!-- Google Fonts: Noto Sans TC & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/static/style.css?v=13.0">
</head>
<body>

    <!-- Header Navbar (基隆景點導覽 置中純文字標題) -->
    <header class="site-header py-4">
        <div class="container d-flex align-items-center justify-content-center text-center">
            <div class="brand-wrapper text-center">
                <h1 class="h4 fw-bold mb-0 brand-title">基隆景點導覽</h1>
                <p class="brand-subtitle mb-0 mt-1">Keelung Tourism Explorer</p>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container py-4">

        <!-- District Filter Section -->
        <section class="district-section p-4 mb-4">
            <h2 class="section-heading mb-3">
                <i class="fa-solid fa-map-location-dot me-2"></i>探索行政區
            </h2>
            
            <div class="d-flex flex-wrap gap-2" id="districtButtons">
                <button class="btn btn-district active" data-zone="中山區">中山區</button>
                <button class="btn btn-district" data-zone="信義區">信義區</button>
                <button class="btn btn-district" data-zone="仁愛區">仁愛區</button>
                <button class="btn btn-district" data-zone="中正區">中正區</button>
                <button class="btn btn-district" data-zone="安樂區">安樂區</button>
                <button class="btn btn-district" data-zone="七堵區">七堵區</button>
                <button class="btn btn-district" data-zone="暖暖區">暖暖區</button>
            </div>
        </section>

        <!-- Status & Count Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-1">
            <div class="d-flex align-items-center">
                <span id="currentDistrictTitle" class="district-badge me-3">中山區</span>
                <span class="hot-sights-label fw-bold fs-5">熱門景點導覽</span>
            </div>
            <span class="sights-count-badge" id="sightsCountBadge">載入中...</span>
        </div>

        <!-- Sights Cards Container -->
        <div class="row g-4" id="sightsContainer">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-secondary" role="status" style="width: 2.2rem; height: 2.2rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">正在載入景點資料...</p>
            </div>
        </div>

    </main>

    <!-- 詳細介紹 彈窗 (關閉按鈕顯眼化) -->
    <div class="modal fade mac-modal" id="sightDetailModal" tabindex="-1" aria-labelledby="sightDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content mac-modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header border-0 pb-0 position-relative">
                    <button type="button" class="btn modal-btn-close shadow-none d-flex align-items-center justify-content-center" data-bs-dismiss="modal" aria-label="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="modal-body p-4 pt-2">
                    <div class="modal-img-wrapper mb-3">
                        <img id="modalSightImg" src="" alt="景點圖片" class="modal-sight-img-contain">
                    </div>
                    
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span id="modalSightCategory" class="category-pill"></span>
                        <span id="modalSightZone" class="zone-pill"></span>
                    </div>

                    <h3 id="modalSightTitle" class="modal-sight-title mb-2"></h3>
                    <p id="modalSightAddress" class="modal-sight-address mb-3">
                        <i class="fa-solid fa-location-dot me-1"></i><span></span>
                    </p>

                    <div class="modal-desc-box mb-4">
                        <p id="modalSightDesc" class="mb-0"></p>
                    </div>

                    <div class="d-flex justify-content-end">
                        <a id="modalGmapsBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn-gmaps modal-gmaps-link">
                            <i class="fa-solid fa-map-location-dot"></i> Google Maps
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer py-4 text-center mt-5">
        <div class="container">
            <p class="mb-1 fw-medium">基隆景點瀏覽器 &copy; Keelung Tourism Explorer</p>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="/static/main.js?v=13.0"></script>
</body>
</html>
