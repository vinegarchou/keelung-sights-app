<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基隆景點導覽 | Keelung Tourism Explorer</title>
    
    <!-- Google Fonts: Noto Sans TC & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/static/style.css?v=21.0">
</head>
<body>

    <!-- Header Hero Banner (港灣橫幅背景、標題靠左、英文下方直線延伸至最右邊、選區同列不換行、下移隨頁面滾動) -->
    <header class="hero-header-banner position-relative">
        <div class="hero-overlay"></div>
        <div class="container position-relative z-2 py-4">
            
            <!-- 頂部標題靠左對齊，無左側圖標，英文下方附帶一條直線延伸至最右邊 -->
            <div class="brand-section mb-3 w-100">
                <div class="brand-wrapper text-start">
                    <h1 class="brand-title mb-0 text-white">基隆景點導覽</h1>
                    <p class="brand-subtitle mb-0 text-white-50">Keelung Tourism Explorer</p>
                </div>
                
            </div>

            <!-- 中央搜尋列與選區按鈕 (所有按鈕確保在同一列，不換行) -->
            <div class="hero-search-container text-center mx-auto my-3">
                <div class="search-box-wrapper shadow rounded-pill p-1 bg-white d-flex align-items-center mx-auto mb-3">
                    <div class="search-icon-btn rounded-circle d-flex align-items-center justify-content-center me-2 ms-1">
                        <i class="fa-solid fa-magnifying-glass text-white"></i>
                    </div>
                    <input type="text" id="searchInput" class="form-control border-0 shadow-none bg-transparent ps-2 fs-6" placeholder="搜尋基隆景點..." aria-label="Search sights">
                </div>

                <!-- 選區按鈕列 (同一列 nowrap，全域排列整齊) -->
                <div class="district-buttons-wrapper">
                    <div class="d-flex align-items-center justify-content-start justify-content-md-center gap-2 flex-nowrap" id="districtButtons">
                        <button class="btn btn-zone-pill active" data-zone="ALL">ALL</button>
                        <button class="btn btn-zone-pill" data-zone="中山區">中山區</button>
                        <button class="btn btn-zone-pill" data-zone="信義區">信義區</button>
                        <button class="btn btn-zone-pill" data-zone="中正區">中正區</button>
                        <button class="btn btn-zone-pill" data-zone="仁愛區">仁愛區</button>
                        <button class="btn btn-zone-pill" data-zone="安樂區">安樂區</button>
                        <button class="btn btn-zone-pill" data-zone="暖暖區">暖暖區</button>
                        <button class="btn btn-zone-pill" data-zone="七堵區">七堵區</button>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container py-4">

        <!-- Status & Count Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-1 flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
                <span id="currentDistrictTitle" class="current-zone-badge">全部景點</span>
                <span class="text-muted small fs-6">點擊景點標題可查看詳細介紹</span>
            </div>
            <span class="sights-count-badge" id="sightsCountBadge">載入中...</span>
        </div>

        <!-- Sights Container (僅照片有框，下方標題地址無框) -->
        <div class="row g-4" id="sightsContainer">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-pink" role="status" style="width: 2.2rem; height: 2.2rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">正在載入景點資料...</p>
            </div>
        </div>

    </main>

    <!-- 詳細介紹 彈窗 (超顯眼關閉按鈕) -->
    <div class="modal fade mac-modal" id="sightDetailModal" tabindex="-1" aria-labelledby="sightDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content mac-modal-content border-0 shadow-lg rounded-4 overflow-hidden bg-white">
                <div class="modal-header border-0 pb-0 position-relative p-0">
                    <button type="button" class="btn modal-btn-close shadow-lg d-flex align-items-center justify-content-center" data-bs-dismiss="modal" aria-label="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="modal-body p-4 pt-2">
                    <div class="modal-img-wrapper mb-3 position-relative rounded-4 overflow-hidden">
                        <img id="modalSightImg" src="" alt="景點圖片" class="modal-sight-img-contain">
                    </div>
                    
                    <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
                        <span id="modalSightCategory" class="category-pill"></span>
                        <span id="modalSightZone" class="zone-pill"></span>
                    </div>

                    <h3 id="modalSightTitle" class="modal-sight-title mb-2 text-pink fw-bold"></h3>
                    <p id="modalSightAddress" class="modal-sight-address mb-3 text-secondary">
                        <i class="fa-solid fa-location-dot me-1 text-pink"></i><span></span>
                    </p>

                    <div class="modal-desc-box mb-4 p-3 bg-light rounded-3">
                        <p id="modalSightDesc" class="mb-0 text-secondary"></p>
                    </div>

                    <div class="d-flex justify-content-end">
                        <a id="modalGmapsBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-gmaps-modal">
                            <i class="fa-solid fa-map-location-dot me-1"></i> Maps 導航
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer py-4 bg-white border-top text-center mt-5">
        <div class="container text-start text-md-center">
            <p class="mb-1 fw-bold text-dark fs-6">基隆景點導覽 &copy; Keelung Tourism Explorer</p>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="/static/main.js?v=21.0"></script>
</body>
</html>
